<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">XM5 Studio</title>
  <desc id="description">A warm gold S drawn as a continuous signal path on a charcoal rounded square.</desc>
  <defs>
    <linearGradient id="case" x1="112" y1="64" x2="880" y2="992" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#303234"/>
      <stop offset="0.5" stop-color="#1d1f21"/>
      <stop offset="1" stop-color="#111214"/>
    </linearGradient>
    <linearGradient id="edge" x1="160" y1="32" x2="864" y2="992" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62605a"/>
      <stop offset="0.45" stop-color="#363634"/>
      <stop offset="1" stop-color="#232426"/>
    </linearGradient>
    <linearGradient id="signal" x1="348" y1="272" x2="672" y2="756" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe5ae"/>
      <stop offset="0.48" stop-color="#f0cd81"/>
      <stop offset="1" stop-color="#c79549"/>
    </linearGradient>
  </defs>
  <!-- Transparent margins and corners are part of the asset. -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#edge)"/>
  <rect x="37" y="37" width="950" height="950" rx="219" fill="url(#case)"/>
  <!-- A custom monoline S: equal bowls, open counters and rounded terminals. -->
  <path d="M 704,300 H 438 C 348,300 298,350 298,406 C 298,470 348,512 438,512 H 586 C 676,512 726,554 726,618 C 726,674 676,724 586,724 H 320"
        fill="none" stroke="url(#signal)" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
